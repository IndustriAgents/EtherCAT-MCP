[project]
name = "ethercat-mcp"
version = "0.1.0"
description = "Model Context Protocol server for EtherCAT (PySOEM + MCP tooling)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "IndustriAgents" }]
dependencies = [
    "anyio>=4.0.0",
    "mcp[cli]>=1.22.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.1.0",
    "pysoem>=1.1.12",
    "lxml>=4.9.0",
]

[project.urls]
Repository = "https://github.com/IndustriAgents/EtherCAT-MCP"

[project.scripts]
ethercat-mcp = "ethercat_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
