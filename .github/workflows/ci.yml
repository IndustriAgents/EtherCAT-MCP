name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Nothing here needs EtherCAT hardware or raw-socket privileges. The PySOEM
# code paths are unit-tested against a fake pysoem module, and the end-to-end
# test drives the real server over stdio against the mock slave
# (ETHERCAT_BACKEND=mock), so no network interface is ever opened.
jobs:
  server:
    name: MCP server (ethercat-python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ethercat-python
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies from uv.lock
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run --locked ruff check .

      - name: Format (ruff format --check)
        run: uv run --locked ruff format --check .

      - name: Byte-compile sources
        run: uv run --locked python -m compileall -q src

      - name: CLI help
        run: uv run --locked ethercat-mcp --help

      # Unit tests (config, codec, ESI parser, PySOEM backend against a fake
      # pysoem, tools) plus the stdio tests and the end-to-end test that starts
      # ../ethercat-mock-slave and drives `ethercat-mcp` with the MCP client SDK.
      - name: Tests (pytest)
        run: uv run --locked pytest

  # Suite rule: the floors in pyproject.toml must be honest. Install the lowest
  # versions of the direct dependencies they allow and run the whole suite.
  server-lowest:
    name: MCP server, lowest direct dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ethercat-python
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install the lowest direct dependencies pyproject.toml allows
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/lowest"
          uv pip install --python "$RUNNER_TEMP/lowest/bin/python" --resolution lowest-direct -e . "pytest>=8.2.0"
          uv pip list --python "$RUNNER_TEMP/lowest/bin/python" | grep -iE "^(anyio|lxml|mcp|pydantic|pysoem|python-dotenv|pytest) "

      - name: Tests (pytest)
        run: '"$RUNNER_TEMP/lowest/bin/python" -m pytest -p no:cacheprovider'

  mock:
    name: Mock slave (ethercat-mock-slave)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ethercat-mock-slave
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies from uv.lock
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run --locked ruff check .

      - name: Format (ruff format --check)
        run: uv run --locked ruff format --check .

      - name: Entry point help
        run: uv run --locked ethercat-mock-slave --help

      - name: Tests (pytest)
        run: uv run --locked pytest

  packages:
    name: Installed wheel and npm contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; same pin as release
        with:
          node-version: '22'
      - run: python scripts/verify_contract.py
      - run: python scripts/prepare_npm.py
      - run: npm --prefix npm test
      - run: npm pack --ignore-scripts
        working-directory: npm
      - run: python scripts/smoke_packages.py python
      - run: python scripts/smoke_packages.py npm
      - run: uvx twine check --strict dist/*
