name: Release packages
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to build and publish; blank builds the selected branch only'
        required: false
        type: string
        default: ''
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validate requested release tag
        if: inputs.release_tag != ''
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          package = json.loads(Path('npm/package.json').read_text())
          assert os.environ['REQUESTED_RELEASE_TAG'] == 'v' + package['version'], 'Tag must match the package version'
          PYTHON
          git rev-parse HEAD
      - run: python scripts/verify_contract.py
      - run: uv sync --locked
        working-directory: ethercat-python
      - run: uv run --locked python -m pytest -q
        working-directory: ethercat-python
      - run: python scripts/prepare_npm.py
      - run: uvx twine check --strict dist/*
      - run: npm test && npm pack --ignore-scripts
        working-directory: npm
      - run: python scripts/smoke_packages.py python
      - run: python scripts/smoke_packages.py npm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            dist/*
            npm/*.tgz
  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
  npm:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm publish ./npm/*.tgz --provenance --access public
